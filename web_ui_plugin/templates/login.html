<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Vinted Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/bricolage-grotesque@5.1.0/index.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="login-body">
<main class="login-card">
    <div class="login-logo"><i class="bi bi-bell-fill"></i></div>
    <h1>Vinted Notifications</h1>
    <p class="text-muted">Enter the password to continue.</p>
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control mb-3" id="password" name="password" autocomplete="current-password" autofocus required>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
</main>
</body>
</html>
