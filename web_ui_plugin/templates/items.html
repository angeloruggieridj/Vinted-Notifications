{% extends "base.html" %}

{% block title %}Items - Vinted Notifications{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Items</h1>
</div>

{% if autorefresh_enabled %}
<div class="mb-3" id="autoRefreshBox" data-interval="{{ autorefresh_interval }}">
    <div class="d-flex justify-content-between small text-muted mb-1">
        <span><i class="bi bi-arrow-repeat me-1"></i> Auto-refresh enabled</span>
        <span>Next refresh in <span id="autoRefreshCountdown">{{ autorefresh_interval }}</span>s</span>
    </div>
    <div class="progress" style="height: 6px;">
        <div class="progress-bar bg-info" id="autoRefreshBar" role="progressbar" style="width: 0%"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
</div>
{% endif %}

<div class="row mb-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <i class="bi bi-funnel-fill me-2 text-info"></i>
                <h5 class="card-title mb-0">Filter Items</h5>
            </div>
            <div class="card-body">
                <form action="/items" method="get" id="filterForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="query" class="form-label fw-semibold">Query</label>
                            <select class="form-select" id="query" name="query">
                                <option value="">All Queries</option>
                                {% for query in queries %}
                                <option value="{{ query.query_id }}" {% if selected_query == query.query_id|string %}selected{% endif %}>
                                    {{ query.display }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="sort" class="form-label fw-semibold">Sort by</label>
                            <select class="form-select" id="sort" name="sort">
                                <option value="newest" {% if f.sort == 'newest' %}selected{% endif %}>Newest first</option>
                                <option value="oldest" {% if f.sort == 'oldest' %}selected{% endif %}>Oldest first</option>
                                <option value="price_asc" {% if f.sort == 'price_asc' %}selected{% endif %}>Price: low to high</option>
                                <option value="price_desc" {% if f.sort == 'price_desc' %}selected{% endif %}>Price: high to low</option>
                                <option value="stars_desc" {% if f.sort == 'stars_desc' %}selected{% endif %}>Seller stars: high to low</option>
                                <option value="reviews_desc" {% if f.sort == 'reviews_desc' %}selected{% endif %}>Seller reviews: high to low</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="period" class="form-label fw-semibold">Found in</label>
                            <select class="form-select" id="period" name="period">
                                <option value="">Any time</option>
                                <option value="1h" {% if f.period == '1h' %}selected{% endif %}>Last hour</option>
                                <option value="6h" {% if f.period == '6h' %}selected{% endif %}>Last 6 hours</option>
                                <option value="24h" {% if f.period == '24h' %}selected{% endif %}>Last 24 hours</option>
                                <option value="7d" {% if f.period == '7d' %}selected{% endif %}>Last 7 days</option>
                                <option value="30d" {% if f.period == '30d' %}selected{% endif %}>Last 30 days</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="limit" class="form-label fw-semibold">Number of Items</label>
                            <select class="form-select" id="limit" name="limit">
                                {% for n in (10, 25, 50, 100, 200) %}
                                <option value="{{ n }}" {% if f.limit == n %}selected{% endif %}>{{ n }} items</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label for="q" class="form-label fw-semibold">Title contains</label>
                            <input type="search" class="form-control" id="q" name="q" value="{{ f.q }}"
                                   placeholder="e.g. mercurial">
                        </div>
                        <div class="col-md-3">
                            <label for="seller" class="form-label fw-semibold">Seller name</label>
                            <input type="search" class="form-control" id="seller" name="seller" value="{{ f.seller }}"
                                   placeholder="e.g. tecsimp">
                        </div>
                        <div class="col-6 col-md-1">
                            <label for="min_price" class="form-label fw-semibold">Min price</label>
                            <input type="number" class="form-control" id="min_price" name="min_price" min="0"
                                   step="any" value="{{ f.min_price }}">
                        </div>
                        <div class="col-6 col-md-1">
                            <label for="max_price" class="form-label fw-semibold">Max price</label>
                            <input type="number" class="form-control" id="max_price" name="max_price" min="0"
                                   step="any" value="{{ f.max_price }}">
                        </div>
                        <div class="col-6 col-md-2">
                            <label for="min_stars" class="form-label fw-semibold">Min seller stars</label>
                            <input type="number" class="form-control" id="min_stars" name="min_stars" min="0" max="5"
                                   step="0.1" value="{{ f.min_stars }}">
                        </div>
                        <div class="col-6 col-md-2">
                            <label for="min_reviews" class="form-label fw-semibold">Min seller reviews</label>
                            <input type="number" class="form-control" id="min_reviews" name="min_reviews" min="0"
                                   step="1" value="{{ f.min_reviews }}">
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button type="button" class="btn btn-outline-secondary" id="resetFilters">
                            <i class="bi bi-x-circle me-1"></i> Reset filters
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search me-1"></i> Apply Filter
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12" id="itemsResults">
        {% include "_items_results.html" %}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('filterForm');
        const results = document.getElementById('itemsResults');
        const defaults = {limit: '50', sort: 'newest'};

        // ---- Card / list view (persisted, re-applied after every update) ----
        function applyView() {
            const view = localStorage.getItem('vintedViewPreference') || 'card';
            const cardView = document.getElementById('cardView');
            const listView = document.getElementById('listView');
            const cardBtn = document.getElementById('cardViewBtn');
            const listBtn = document.getElementById('listViewBtn');
            cardView.style.display = view === 'card' ? 'flex' : 'none';
            listView.style.display = view === 'card' ? 'none' : 'block';
            cardBtn.classList.toggle('active', view === 'card');
            listBtn.classList.toggle('active', view !== 'card');
        }

        results.addEventListener('click', function (e) {
            if (e.target.closest('#cardViewBtn')) {
                localStorage.setItem('vintedViewPreference', 'card');
                applyView();
            } else if (e.target.closest('#listViewBtn')) {
                localStorage.setItem('vintedViewPreference', 'list');
                applyView();
            }
        });

        // ---- Timestamps rendered in the viewer's own timezone ----
        function localizeTimes() {
            results.querySelectorAll('time.local-ts').forEach(function (el) {
                const ts = parseInt(el.dataset.ts, 10);
                if (ts) el.textContent = new Date(ts * 1000).toLocaleString('sv-SE');
            });
        }

        // ---- Fetch the results block with the current filters (no page reload) ----
        let controller = null;

        function currentParams() {
            const params = new URLSearchParams();
            new FormData(form).forEach(function (value, key) {
                value = String(value).trim();
                if (value !== '' && defaults[key] !== value) params.set(key, value);
            });
            return params;
        }

        async function refreshResults() {
            const params = currentParams();
            const qs = params.toString();
            history.replaceState(null, '', '/items' + (qs ? '?' + qs : ''));
            if (controller) controller.abort();
            controller = new AbortController();
            try {
                const response = await fetch('/items/fragment' + (qs ? '?' + qs : ''),
                    {signal: controller.signal, headers: {'X-Requested-With': 'fetch'}});
                if (!response.ok) return;
                results.innerHTML = await response.text();
                applyView();
                localizeTimes();
            } catch (err) {
                if (err.name !== 'AbortError') console.error('Items refresh failed', err);
            }
        }

        // ---- Dynamic filters ----
        let debounce = null;
        form.addEventListener('change', function (e) {
            if (e.target.tagName === 'SELECT') refreshResults();
        });
        form.addEventListener('input', function (e) {
            if (e.target.tagName === 'INPUT') {
                clearTimeout(debounce);
                debounce = setTimeout(refreshResults, 400);
            }
        });
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            refreshResults();
        });
        document.getElementById('resetFilters').addEventListener('click', function () {
            form.querySelectorAll('select').forEach(function (s) {
                s.value = defaults[s.name] !== undefined ? defaults[s.name] : '';
            });
            form.querySelectorAll('input').forEach(function (i) { i.value = ''; });
            refreshResults();
        });

        // ---- Auto-refresh with progress bar (enabled from Config) ----
        // Only the timer calls refreshResults() on schedule; changing a filter updates
        // the list but leaves the countdown running.
        const arBox = document.getElementById('autoRefreshBox');
        if (arBox) {
            const intervalMs = parseInt(arBox.dataset.interval, 10) * 1000;
            const bar = document.getElementById('autoRefreshBar');
            const countdown = document.getElementById('autoRefreshCountdown');
            let elapsed = 0;
            let last = Date.now();
            setInterval(function () {
                const now = Date.now();
                // Don't burn requests (or count time) while the tab is in the background
                if (!document.hidden) elapsed += now - last;
                last = now;
                const pct = Math.min(100, (elapsed / intervalMs) * 100);
                bar.style.width = pct + '%';
                bar.setAttribute('aria-valuenow', Math.round(pct));
                countdown.textContent = Math.max(0, Math.ceil((intervalMs - elapsed) / 1000));
                if (elapsed >= intervalMs) {
                    elapsed = 0;
                    refreshResults();
                }
            }, 250);
        }

        applyView();
        localizeTimes();
    });
</script>
{% endblock %}
