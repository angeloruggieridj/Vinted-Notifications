version: '3.8'

services:
  vinted-notifications:
    # Build from this repository (fork) instead of pulling the upstream image
    build: .
    image: vinted-notifications:local
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - VN_data:/app/data
      - VN_logs:/app/logs
    restart: unless-stopped
    environment:
      # Optional: password for the web interface (can also be set from Configuration > Security)
      - VN_WEB_PASSWORD=${VN_WEB_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp

volumes:
  VN_data:
  VN_logs:
