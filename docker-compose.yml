version: '3.8'

services:
  vinted-notifications:
    # Build from this repository (fork) instead of pulling the upstream image
    build: .
    image: vinted-notifications:local
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - VN_data:/app/data
      - VN_logs:/app/logs
    restart: unless-stopped
    environment:
      # Timezone used for server-side dates/logs (override with TZ=... in your shell or .env)
      - TZ=${TZ:-Europe/Rome}
    read_only: true
    tmpfs:
      - /tmp

volumes:
  VN_data:
  VN_logs:
